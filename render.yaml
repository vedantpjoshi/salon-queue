services:
  - type: web
    name: glamour-queue
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production tsx server/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
